# Extends the stock workflows, limits, and paths in config/base.yaml.
# This file's job is ONE thing: model staffing.

extends: config/base.yaml

# roster: judgement on the Codex subscription (via pi's openai-codex provider), open weights on OpenRouter
#
# No Anthropic models anywhere, and the split follows how each is actually sold:
#
#   openai-codex/*   the ChatGPT subscription. Not metered per token, so these
#                    lanes report real tokens and $0.0000 cost in the trace.
#                    pi is already authenticated for this provider — check with
#                    `pi --list-models | grep openai-codex`.
#   openrouter/*     used EXCLUSIVELY for open-weight models here.
#
#   planner     gpt-6-astra                 subscription · the plan is the highest-leverage artifact
#   reviewer    gpt-5.6-sol                 subscription · judgement against a spec
#   builder     kimi-k3                     openrouter   · open weights, 1M context, strong tool use
#   scout       deepseek-v4-flash           openrouter   · open weights, mechanical recon
#   documenter  deepseek-v4-flash           openrouter   · open weights, one long diff read
#
# Usage:
#   sf run sdlc "<request>" --repo <path> --roster codex-open


# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# v1 runs the Pi coding agent only; coding_agent: claude_code arrives in v2.
defaults:
  coding_agent: pi
  model: openrouter/deepseek/deepseek-v4-flash-0731   # provider/id — provider half is the pi provider name
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e)
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # `writes:` per agent says what it may change IN THE REPO, enforced after every
  # call in factory/modules/permissions.py. `tools` cannot express it: bash runs
  # `git checkout` and write reaches any path, so a capability list is a statement
  # of intent that nothing verifies.
  #
  # It never restricts the session runtime under data_dir — context_handoff/,
  # envelopes, prompts, raw output. Every agent can always write its own report;
  # `writes: []` means read-only with respect to the repo, not mute.
  #
  # Roster-wide `protected_files` lives in config/base.yaml.
agents:
  - name: planner
    model: openai-codex/gpt-6-astra
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: config/prompts/planner/system.md
      user: config/prompts/planner/user.md
    harness_engineering:
      - config/harness/subagents.ts    # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - "{{specs_dir}}/"

    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    model: openrouter/moonshotai/kimi-k3   # open weights, 1M context, strong tool use
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: config/prompts/builder/system.md
      user: config/prompts/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: config/prompts/scout/system.md
      user: config/prompts/scout/user.md
    harness_engineering:
      - config/harness/subagents.ts    # registers the four subagent_* tools below
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: openai-codex/gpt-5.6-sol
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: config/prompts/reviewer/system.md
      user: config/prompts/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit — a reviewer that cannot fix cannot quietly fix
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: openrouter/deepseek/deepseek-v4-flash-0731
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: config/prompts/documenter/system.md
      user: config/prompts/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - "{{docs_dir}}/"                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only (prompted, since docs are files too)
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
