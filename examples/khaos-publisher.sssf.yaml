# khaos-publisher's factory config.
#
# Copy this to ~/Projects/khaos-publisher/sssf.config.yaml, or drive it in place:
#   sf check --repo ~/Projects/khaos-publisher \
#            --config examples/khaos-publisher.sssf.yaml
#
# Every timeout below is roughly 20x a measured run on this machine, so a slow
# day does not read as a failure:
#   npm run test:contracts     8s
#   npm run test:scripts       3s
#   npm run typecheck          4s
#   npm run check:code-health  <1s
#   npm run validate:contracts <1s
#   npm run check:docs         <1s
#   npm test                  11s  — and see the warning under `groups:`

extends: config/rosters/open-weights.yaml

paths:
  # This repo keeps curated documentation in docs/ (docs/adr, ARCHITECTURE.md,
  # …), so factory output is kept out of that root rather than mixed into it.
  specs: docs/specs/
  docs: docs/runs/

# ─── prepare: make the tree runnable before anything judges it ────────────────
# Runs as the FIRST phase of every workflow, before any agent spawns, and aborts
# the run on failure. A fresh `git worktree` — how the factory isolates a run —
# has no node_modules, and every check below then fails for a reason that has
# nothing to do with the code. Measured: six checks red in a new worktree, all
# six green after one install.
#
# Both commands are THIS PROJECT'S OWN, not generic guesses, so they follow the
# repo instead of drifting from it:
#
#   just bootstrap      `npm ci` — the pinned install from the lockfile. Chosen
#                       over `npm install` deliberately: ci cannot silently move
#                       package-lock.json, and if a builder adds a dependency
#                       without updating the lockfile, the NEXT run's prepare
#                       fails loudly instead of judging a tree that only works
#                       on this machine.
#
#   just install-hooks  Points core.hooksPath at the tracked hooks. The factory
#                       commits, so the commit-msg hook that strips agent
#                       trailers has to be live — this repo's
#                       `check:commit-trailers` gate fails a branch that carries
#                       them.
#
#                       SIDE EFFECT, stated because it reaches outside the
#                       worktree: git config is shared between a repo and its
#                       worktrees, so this writes the parent repo's config too.
#                       It sets the RELATIVE path the recipe intends, which is
#                       also a fix — the live value was absolute
#                       (/Users/k/Projects/khaos-publisher/scripts/hooks), so
#                       every worktree was running main's copy of the hook
#                       instead of its own branch's.
#
# Both are idempotent; prepare runs on every workflow, not once per tree.
prepare:
  bootstrap:
    argv: [just, bootstrap]
    area: repo
    operation: install
    timeout_seconds: 900
    description: Install pinned dependencies from the lockfile

  hooks:
    argv: [just, install-hooks]
    area: repo
    operation: install
    timeout_seconds: 60
    description: Point git at the tracked commit-msg hook this repo's gate requires

quality:
  checks:
    test_contracts:
      argv: [npm, run, test:contracts]
      area: contracts
      operation: test
      timeout_seconds: 180
      description: node --test over experiments/*.test.mjs

    test_scripts:
      argv: [npm, run, test:scripts]
      area: scripts
      operation: test
      timeout_seconds: 120
      description: node --test over scripts/**/*.test.mjs

    typecheck:
      argv: [npm, run, typecheck]
      area: app
      operation: typecheck
      timeout_seconds: 300

    code_health:
      argv: [npm, run, check:code-health]
      area: repo
      operation: lint
      timeout_seconds: 120

    validate_contracts:
      argv: [npm, run, validate:contracts]
      area: contracts
      operation: lint
      timeout_seconds: 120

    docs_check:
      argv: [npm, run, check:docs]
      area: repo
      operation: lint
      timeout_seconds: 120

    # The whole suite across every workspace. NOT in the `test` group on purpose
    # — see below.
    test_all:
      argv: [npm, test]
      area: app
      operation: test
      timeout_seconds: 900
      description: every workspace suite; the repo's own definition of green

  groups:
    # What the verify loop re-runs after every builder repair. It must be FAST
    # and it must be GREEN before the factory starts, or the builder spends its
    # whole repair budget on a failure it did not cause.
    #
    # `npm test` is excluded because on main, today, it FAILS: apps/console's
    # profile-card tests raise ERR_MODULE_NOT_FOUND for
    # @kpublish/profile-card-renderer-experiment, which is declared in the root
    # `workspaces` but not linked under node_modules/@kpublish/. Run `npm
    # install` at the root to link it, confirm `npm test` is green, then move
    # test_all into this group where it belongs.
    test: [test_contracts, test_scripts]

    # What the `quality` workflow runs. Deliberately not `npm run check`: that
    # chain includes check:production-release, check:threshold, check:install
    # and check:runner-compatibility, which reach for AWS and release state —
    # not something an agent loop should be triggering.
    full: [test_contracts, test_scripts, typecheck,
           code_health, validate_contracts, docs_check]

# ─── model staffing overrides ─────────────────────────────────────────────────
# All open weights, and nothing here depends on a subscription quota.
#
# Routed FIRST-PARTY where pi is authenticated for the provider directly
# (`deepseek`, `moonshotai` — check with `pi --list-models | awk '$1=="deepseek"'`),
# because that skips OpenRouter's margin on the same weights. `z-ai` has no direct
# provider, so GLM stays on OpenRouter — which is the rule anyway: OpenRouter for
# open models, and here for the one open model that has no direct route.
#
# The tradeoff, stated because it is easy to lose: the direct providers expose
# UNDATED ids only (`deepseek-v4-pro`, not `-0813`). Those are rolling aliases, so
# a best-of-N comparison run months apart is not comparing the same weights. Pin
# through OpenRouter's dated ids instead when reproducibility matters more than
# margin: openrouter/deepseek/deepseek-v4-pro-0813.
agents:
  # DeepSeek v4 Pro replaces GPT-6-Astra on the plan. The plan is the
  # highest-leverage artifact — the builder implements it without re-deciding
  # anything — so the strongest non-subscription model goes here.
  - name: planner
    model: deepseek/deepseek-v4-pro
    thinking: high

  - name: builder
    model: moonshotai/kimi-k3          # 1M context, strong tool use, direct

  - name: scout
    model: deepseek/deepseek-v4-flash  # mechanical recon, direct

  - name: documenter
    model: deepseek/deepseek-v4-flash  # one long diff read, direct

  # GLM 5.3 Flash on the verdict: chosen for pricing/performance, and it keeps the
  # 1M window the reviewer needs to read a whole diff against a whole plan.
  # OpenRouter is the only route — z-ai exposes no direct provider to pi.
  - name: reviewer
    model: openrouter/z-ai/glm-5.3-flash
    thinking: high
